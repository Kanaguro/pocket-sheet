name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: mkdir -p www && cp index.html www/index.html
      - run: npx cap add android
      - run: npx cap sync android
      # Same signing key every build. The key is written into the Android project itself so Gradle cannot ignore it.
      - run: |
          mkdir -p ~/.android
          base64 -d debug.keystore.txt > ~/.android/debug.keystore
          cp ~/.android/debug.keystore android/app/pocket.keystore
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file('pocket.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          EOF
          keytool -list -v -keystore android/app/pocket.keystore -storepass android | grep -i "SHA256"
      # Higher version number every build, so Android treats it as an update.
      - run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: ./gradlew assembleDebug
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk PocketSheet.apk
      # Prints the APK's signing fingerprint. It must be the same in every run.
      - run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs PocketSheet.apk | grep -i "SHA-256" || true
      - uses: actions/upload-artifact@v4
        with:
          name: PocketSheet
          path: PocketSheet.apk
          if-no-files-found: error
